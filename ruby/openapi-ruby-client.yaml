---
generatorName: ruby
inputSpec: oas-2026-10-01.normalized.yaml
outputDir: "."
# Skip the per-class markdown docs (~1k files of churn, not shipped in the
# gem; rubydoc.info serves docs from the YARD comments once published).
globalProperties:
  apiDocs: "false"
  modelDocs: "false"
# Inline schemas whose generated file name would exceed the 100-byte ustar
# cap enforced by `gem build` (Gem::Package::TooLongFileName). Keys are the
# names openapi-generator derives for them (operationId + property path);
# values are the model names that replace them.
inlineSchemaNameMappings:
  performance_review_questionnaire_by_strategies_update_questionnaire_for_strategy_post_request_questionnaire_content_inner: performance_review_questionnaire_section
  performance_review_questionnaire_by_strategies_update_questionnaire_for_strategy_post_request_questionnaire_content_inner_questions_inner: performance_review_questionnaire_question
  performance_review_questionnaire_by_strategies_update_questionnaire_for_strategy_post_request_questionnaire_content_inner_questions_inner_metadata: performance_review_questionnaire_question_metadata
  performance_review_questionnaire_by_strategies_update_default_rating_scale_post_request_default_rating_scale_inner: performance_review_rating_scale_option
  performance_review_evaluation_answer_answered_questionnaire_with_sections_content_inner_questions_inner: performance_review_evaluation_answered_question
  performance_review_evaluation_answer_answered_questionnaire_with_sections_content_inner_questions_inner_answer: performance_review_evaluation_question_answer
  performance_review_evaluation_answer_answered_questionnaire_with_sections_content_inner_questions_inner_answer_answer_rating: performance_review_evaluation_question_answer_rating
additionalProperties:
  gemName: factorial_api
  # The gem claims a single namespace (F::Api) on the shared F:: root; the
  # namespace prelude that defines F itself is re-attached by generate_sdk.rb.
  moduleName: F::Api
  gemVersion: 3.0.0
  library: faraday
  gemLicense: MIT
  gemHomepage: https://github.com/factorialco/factorial-api-sdks
  gemSummary: Ruby SDK for the Factorial public API
