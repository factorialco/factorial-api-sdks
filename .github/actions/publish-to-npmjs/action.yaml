name: "Publish to npmjs"
description: "Publish package to npmjs registry"

inputs:
  registry_token:
    description: "Registry token"
    required: true
  working-directory:
    description: "Working directory"
    required: false
    default: "."
  tag:
    description: "Space-separated npm dist-tag(s) to publish under (e.g. '2026-04-01 latest'). Omit to publish with the default 'latest' tag."
    required: false
    default: ""

outputs:
  published:
    description: "Published packages"
    value: ${{ steps.publish.outputs.published }}

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-node-pnpm
      name: Setup Node and pnpm
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Check if version already published
      shell: bash
      id: check
      working-directory: ${{ inputs.working-directory }}
      run: |
        PACKAGE=$(node -p "require('./package.json').name")
        VERSION=$(node -p "require('./package.json').version")
        if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
          echo "✅ $PACKAGE@$VERSION is already published — skipping publish."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "$PACKAGE@$VERSION is not yet published — proceeding."
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      if: steps.check.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm build

    - name: Publish to registry
      if: steps.check.outputs.skip != 'true'
      shell: bash
      id: publish
      working-directory: ${{ inputs.working-directory }}
      run: |
        TAGS=(${{ inputs.tag }})
        if [ ${#TAGS[@]} -gt 0 ]; then
          PUBLISH_CMD="pnpm publish --no-git-checks --access=public --tag ${TAGS[0]}"
        else
          PUBLISH_CMD="pnpm publish --no-git-checks --access=public"
        fi

        result=$($PUBLISH_CMD)
        if [[ $result == "There are no new packages that should be published" ]]; then
          echo "No new packages to publish"
          echo "published=false" >> $GITHUB_OUTPUT
        else
          echo "Packages published"
          echo "published=true" >> $GITHUB_OUTPUT

          # Add any extra dist-tags
          if [ ${#TAGS[@]} -gt 1 ]; then
            PACKAGE=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            for extra_tag in "${TAGS[@]:1}"; do
              npm dist-tag add "$PACKAGE@$VERSION" "$extra_tag"
            done
          fi
        fi
      env:
        NODE_AUTH_TOKEN: ${{ inputs.registry_token }}
