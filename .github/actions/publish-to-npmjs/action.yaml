name: "Publish to npmjs"
description: "Publish package to npmjs registry"

inputs:
  registry_token:
    description: >-
      npm token. Publishing itself uses npm trusted publishing (GitHub OIDC, needs
      `id-token: write` on the calling job), so this is only needed when extra
      dist-tags are added after publish (`npm dist-tag add` has no OIDC path).
    required: false
    default: ""
  working-directory:
    description: "Working directory"
    required: false
    default: "."
  tag:
    description: "Space-separated npm dist-tag(s) to publish under (e.g. '2026-04-01 latest'). Omit to publish with the default 'latest' tag."
    required: false
    default: ""

outputs:
  published:
    description: "Published packages"
    value: ${{ steps.publish.outputs.published }}

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-node-pnpm
      name: Setup Node and pnpm
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Check if version already published
      shell: bash
      id: check
      working-directory: ${{ inputs.working-directory }}
      run: |
        PACKAGE=$(node -p "require('./package.json').name")
        VERSION=$(node -p "require('./package.json').version")
        if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
          echo "✅ $PACKAGE@$VERSION is already published — skipping publish."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "$PACKAGE@$VERSION is not yet published — proceeding."
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      if: steps.check.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm build

    - name: Publish to registry
      if: steps.check.outputs.skip != 'true'
      shell: bash
      id: publish
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Auth via npm trusted publishing (GitHub OIDC): the package on npmjs is
        # bound to this repo + workflow file. OIDC publishing needs npm >= 11.5.1
        # and Node 22 bundles npm 10, hence the upgrade. Provenance is attached
        # automatically.
        npm install -g npm@latest
        TAGS=(${{ inputs.tag }})
        if [ ${#TAGS[@]} -gt 0 ]; then
          npm publish --access public --tag "${TAGS[0]}"
        else
          npm publish --access public
        fi
        echo "Packages published"
        echo "published=true" >> "$GITHUB_OUTPUT"

    - name: Add extra dist-tags
      if: steps.check.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # `npm dist-tag` has no OIDC flow, so this step is the only one that still
      # needs a token.
      env:
        NODE_AUTH_TOKEN: ${{ inputs.registry_token }}
      run: |
        set -euo pipefail
        TAGS=(${{ inputs.tag }})
        if [ ${#TAGS[@]} -le 1 ]; then
          echo "No extra dist-tags to add."
          exit 0
        fi
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "::error::extra dist-tags requested (${TAGS[*]:1}) but no registry_token provided." >&2
          exit 1
        fi
        PACKAGE=$(node -p "require('./package.json').name")
        VERSION=$(node -p "require('./package.json').version")
        for extra_tag in "${TAGS[@]:1}"; do
          npm dist-tag add "$PACKAGE@$VERSION" "$extra_tag"
        done
