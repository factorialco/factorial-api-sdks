name: "Publish to RubyGems"
description: "Publish gem to rubygems.org"

inputs:
  registry_token:
    description: "RubyGems API key"
    required: true
  working-directory:
    description: "Working directory"
    required: false
    default: "."
  ruby-version:
    description: "Ruby version"
    required: false
    default: "3.4"

outputs:
  published:
    description: "Whether package was published"
    value: ${{ steps.publish.outputs.published }}

runs:
  using: "composite"
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        working-directory: ${{ inputs.working-directory }}

    - name: Check if version already published
      shell: bash
      id: check
      working-directory: ${{ inputs.working-directory }}
      run: |
        PACKAGE=$(ruby -e "puts Gem::Specification.load(Dir['*.gemspec'].first).name")
        VERSION=$(ruby -e "puts Gem::Specification.load(Dir['*.gemspec'].first).version")
        # The versions endpoint 404s while the gem has never been published —
        # treat that as "not there yet" rather than a failure.
        if curl -fsS "https://rubygems.org/api/v1/versions/$PACKAGE.json" 2>/dev/null \
             | grep -qF "\"number\":\"$VERSION\""; then
          echo "✅ $PACKAGE $VERSION is already on RubyGems — skipping publish."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "$PACKAGE $VERSION is not yet on RubyGems — proceeding."
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      if: steps.check.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: gem build *.gemspec

    - name: Publish to RubyGems
      if: steps.check.outputs.skip != 'true'
      shell: bash
      id: publish
      working-directory: ${{ inputs.working-directory }}
      run: |
        gem push *.gem 2>&1 | tee publish.log
        if grep -qE "Successfully registered|Pushing gem" publish.log; then
          echo "published=true" >> $GITHUB_OUTPUT
        else
          echo "published=false" >> $GITHUB_OUTPUT
        fi
      env:
        GEM_HOST_API_KEY: ${{ inputs.registry_token }}
