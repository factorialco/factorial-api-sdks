name: "Create release"

# Model: release-please owns versioning AND tagging.
#
# On every push to main, release-please maintains a "Release PR" per package
# that bumps the version files + CHANGELOG from the Conventional Commits since
# the last release. Merging that PR makes release-please:
#   1. bump the version file(s),
#   2. create the git tag (typescript-vX.Y.Z / python-vX.Y.Z) on the merge commit,
#   3. create the GitHub Release.
# Because the tag and the version are produced by the same actor in one step,
# they can never drift — which is the class of bug this replaces.
#
# When a release is created, this workflow DISPATCHES the top-level publish.yaml
# for the affected package(s) and waits for it (via the dispatch-publish
# composite action). Dispatch — not workflow_call — because npm trusted
# publishing validates the top-level workflow filename and allows a single
# trusted workflow per package, so publish.yaml must be the top-level run.
# Dispatching with the default GITHUB_TOKEN works (workflow_dispatch is exempt
# from the no-recursive-workflows rule) — no PAT required.
#
# Maintenance branches (1.x, 2.x, ...) get the same treatment: release-please
# reads the config + manifest from the branch that triggered the run and opens
# the Release PR against that branch (target-branch), so previous majors can
# ship patch releases independently. See RELEASING.md § Backporting.

on:
  push:
    branches: [main, "[0-9]+.x"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Run release-please"
    runs-on: ubuntu-latest
    outputs:
      ts_released: ${{ steps.release.outputs['typescript--release_created'] }}
      ts_tag: ${{ steps.release.outputs['typescript--tag_name'] }}
      py_released: ${{ steps.release.outputs['python--release_created'] }}
      py_tag: ${{ steps.release.outputs['python--tag_name'] }}
      rb_released: ${{ steps.release.outputs['ruby--release_created'] }}
      rb_tag: ${{ steps.release.outputs['ruby--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  publish-typescript:
    name: "Publish TypeScript release"
    needs: release-please
    if: needs.release-please.outputs.ts_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # dispatch publish.yaml
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/dispatch-publish
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_tag: ${{ needs.release-please.outputs.ts_tag }}

  publish-python:
    name: "Publish Python release"
    needs: release-please
    if: needs.release-please.outputs.py_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # dispatch publish.yaml
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/dispatch-publish
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_tag: ${{ needs.release-please.outputs.py_tag }}

  publish-ruby:
    name: "Publish Ruby release"
    needs: release-please
    if: needs.release-please.outputs.rb_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # dispatch publish.yaml
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/dispatch-publish
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_tag: ${{ needs.release-please.outputs.rb_tag }}
