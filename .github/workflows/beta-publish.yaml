name: "Publish beta SDKs"

# Daily check for an intermediate Factorial API version (one newer than the
# current stable) and, if found, publish a BETA of both SDKs that consumers can
# opt into — NEVER as the default install:
#   - npm:  <next-major>.0.0-beta.<N> under the `beta` dist-tag (+ the API date),
#           never `latest`.
#   - PyPI: <next-major>.0.0b<N> — a PEP 440 pre-release, which pip skips by default.
#
# Detection (scripts/beta-detect.mjs) is stateless except for beta_state.json,
# which only exists to detect a same-date spec RE-ISSUE so the iteration counter
# can bump. That state lives on a dedicated, unprotected `beta-state` branch
# (never merged into main), so the default GITHUB_TOKEN can update it without any
# branch-protection bypass. The stable cadence stays owned by release-please.

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily. Shift to "0 6"/"0 7" for Madrid-local.
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override API date to build (yyyy-mm-dd). Leave blank to auto-detect."
        required: false
        type: string
      force:
        description: "Republish even if the spec for the date is unchanged (bumps iteration)."
        required: false
        type: boolean
        default: false

concurrency:
  group: beta-publish
  cancel-in-progress: false

permissions:
  contents: write # push beta_state.json to the unprotected beta-state branch

jobs:
  detect:
    name: "Detect intermediate API version"
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      target_date: ${{ steps.detect.outputs.target_date }}
      next_major: ${{ steps.detect.outputs.next_major }}
      npm_version: ${{ steps.detect.outputs.npm_version }}
      pypi_version: ${{ steps.detect.outputs.pypi_version }}
      iteration: ${{ steps.detect.outputs.iteration }}
      spec_sha256: ${{ steps.detect.outputs.spec_sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Load prior beta state
        # Best-effort: pull beta_state.json from the beta-state branch into the
        # working dir so beta-detect.mjs can read it. Missing branch (first run)
        # is fine — detection then starts at iteration 0.
        run: |
          if git fetch --depth 1 origin beta-state 2>/dev/null; then
            git show FETCH_HEAD:beta_state.json > beta_state.json && echo "loaded beta_state.json"
          else
            echo "no beta-state branch yet — starting fresh"
          fi
      - name: Detect
        id: detect
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          FORCE: ${{ inputs.force }}
        run: node scripts/beta-detect.mjs

  build-and-publish:
    name: "Build & publish beta"
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TARGET_DATE: ${{ needs.detect.outputs.target_date }}
      NPM_VERSION: ${{ needs.detect.outputs.npm_version }}
      PYPI_VERSION: ${{ needs.detect.outputs.pypi_version }}
    steps:
      - uses: actions/checkout@v6

      # ── Regenerate BOTH SDKs before publishing either (generation gates all
      #    publishing — a failure here aborts before anything is uploaded). ──
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: ./typescript
      - name: Regenerate TypeScript SDK (beta version)
        working-directory: ./typescript
        env:
          OPENAPI_VERSION: ${{ env.TARGET_DATE }}
        run: npx tsx scripts/release.ts --set-version "$NPM_VERSION" --no-publish --no-git
      - name: Type-check TypeScript
        working-directory: ./typescript
        run: npx tsc --noEmit

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Regenerate Python SDK (beta version)
        working-directory: ./python
        env:
          OPENAPI_VERSION: ${{ env.TARGET_DATE }}
        run: |
          uv sync
          uv run python scripts/release.py --version "$TARGET_DATE" --set-version "$PYPI_VERSION" --no-publish

      # ── Publish (idempotent: composite actions skip if the version exists). ──
      - name: Publish npm beta
        uses: ./.github/actions/publish-to-npmjs
        with:
          registry_token: ${{ secrets.NPMJS_TOKEN }}
          working-directory: ./typescript
          # primary dist-tag `beta` + the API date; NEVER `latest`.
          tag: "beta ${{ env.TARGET_DATE }}"
      - name: Publish PyPI beta
        uses: ./.github/actions/publish-to-pypi
        with:
          registry_token: ${{ secrets.PYPI_TOKEN }}
          working-directory: ./python

      # ── Safety gate (hard fail): the beta must NEVER become the default
      #    install. This runs BEFORE recording state and before the registry
      #    presence check below, so a slow/lagging registry index can never mask
      #    a 'latest' regression. (Registry presence is verified separately,
      #    with retries, after state is recorded — see the last step.)
      - name: Assert npm 'latest' did not move to the beta
        run: |
          set -euo pipefail
          LATEST=$(npm view @factorialco/api-client dist-tags.latest)
          echo "npm latest is: $LATEST"
          if [ "$LATEST" = "$NPM_VERSION" ]; then
            echo "::error::npm 'latest' moved to the beta version — aborting." >&2
            exit 1
          fi
          echo "✅ npm 'latest' is unchanged ($LATEST) — beta stays opt-in only."

      - name: Record beta state on the beta-state branch
        # Push beta_state.json to a dedicated, unprotected orphan branch (never
        # merged into main) using a clean temp clone, so the regenerated SDK in
        # the main working tree is untouched and no main-branch write is needed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_SHA: ${{ needs.detect.outputs.spec_sha256 }}
          ITERATION: ${{ needs.detect.outputs.iteration }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch beta-state "$repo_url" "$tmp" 2>/dev/null; then
            echo "checked out existing beta-state branch"
          else
            echo "creating beta-state branch"
            git clone --depth 1 "$repo_url" "$tmp"
            git -C "$tmp" checkout --orphan beta-state
            git -C "$tmp" rm -rf . >/dev/null 2>&1 || true
          fi
          cat > "$tmp/beta_state.json" <<EOF
          {
            "target_date": "$TARGET_DATE",
            "spec_sha256": "$SPEC_SHA",
            "iteration": $ITERATION
          }
          EOF
          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$tmp" add beta_state.json
          if git -C "$tmp" diff --cached --quiet; then
            echo "beta_state.json unchanged — nothing to record."
          else
            git -C "$tmp" commit -m "chore(beta): record $NPM_VERSION"
            git -C "$tmp" push origin beta-state
          fi

      # ── Confirm both registries actually serve the beta. Registry read paths
      #    lag behind upload (PyPI's CDN can negative-cache a pre-index 404 for
      #    a while), so poll reliable, fast-updating endpoints with retries
      #    instead of hitting a per-version URL once: `npm view` for npm, and the
      #    SIMPLE INDEX (what pip reads) for PyPI, matched on the exact sdist
      #    filename. Runs AFTER state is recorded, so a slow index here can never
      #    drop the iteration baseline.
      - name: Verify beta present on npm and PyPI
        run: |
          set -uo pipefail
          ATTEMPTS=10
          npm_ok=false
          for i in $(seq 1 "$ATTEMPTS"); do
            if npm view "@factorialco/api-client@$NPM_VERSION" version >/dev/null 2>&1; then
              npm_ok=true; echo "✅ npm serves $NPM_VERSION (attempt $i)."; break
            fi
            echo "npm not visible yet ($i/$ATTEMPTS) — retrying in 6s…"; sleep 6
          done
          pypi_ok=false
          PYPI_SDIST="factorial_api_client-${PYPI_VERSION}.tar.gz"
          for i in $(seq 1 "$ATTEMPTS"); do
            if curl -fsS "https://pypi.org/simple/factorial-api-client/" | grep -qF "$PYPI_SDIST"; then
              pypi_ok=true; echo "✅ PyPI simple index lists $PYPI_SDIST (attempt $i)."; break
            fi
            echo "PyPI not visible yet ($i/$ATTEMPTS) — retrying in 6s…"; sleep 6
          done
          if [ "$npm_ok" != "true" ] || [ "$pypi_ok" != "true" ]; then
            echo "::error::beta not visible after $ATTEMPTS retries (npm_ok=$npm_ok pypi_ok=$pypi_ok)." >&2
            exit 1
          fi
          echo "✅ beta present on both registries; latest unchanged."

  cleanup-beta-tag:
    name: "Clean up stale npm beta tag"
    needs: detect
    if: needs.detect.outputs.should_publish == 'false'
    runs-on: ubuntu-latest
    continue-on-error: true # best-effort; never block the pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Remove npm beta tag if it has been superseded by a stable release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          set -euo pipefail
          PKG=@factorialco/api-client
          LATEST_MAJOR=$(jq -r '.latest' version_map.json)
          BETA=$(npm view "$PKG@beta" version 2>/dev/null || true)
          if [ -z "$BETA" ]; then echo "No beta dist-tag; nothing to clean."; exit 0; fi
          BETA_MAJOR=${BETA%%.*}
          # The beta line has graduated once its major is no longer ahead of the
          # current stable major — at that point @beta points below @latest.
          if [ "$BETA_MAJOR" -le "$LATEST_MAJOR" ]; then
            echo "Removing stale beta tag → $PKG@beta ($BETA, major $BETA_MAJOR <= stable $LATEST_MAJOR)"
            npm dist-tag rm "$PKG" beta
          else
            echo "Beta tag ($BETA, major $BETA_MAJOR) is still ahead of stable major $LATEST_MAJOR — keeping."
          fi
