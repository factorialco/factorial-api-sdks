name: "Publish packages"

on:
  release:
    types: [released]
  # Release is not triggered when the release was created by another workflow using GITHUB_TOKEN
  # https://github.com/orgs/community/discussions/25281#discussioncomment-3300251
  workflow_run:
    workflows: [Create release]
    types:
      - completed

  workflow_dispatch: # Allows manual triggering
    inputs:
      release_tag:
        description: "The release tag to checkout (e.g. typescript-v1.2.0 or python-v1.2.0)"
        required: true

jobs:
  publish-typescript:
    name: "[🎯 API-CLIENT] Publish to npm"
    # Only run for TypeScript releases. The tag-prefix check is ANDed with the
    # event check (note the parentheses) so a python-v* release never triggers
    # this job, and vice-versa.
    if: |
      github.head_ref != 'release-please--branches--master'
      && !contains(github.event.pull_request.labels.*.name, 'autorelease')
      && (
        (github.event_name == 'release' && contains(github.event.release.tag_name, 'typescript-v'))
        || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.release_tag, 'typescript-v'))
        || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.outputs.new_version)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.sha }}

      - name: Resolve npm dist-tag
        id: resolve-tag
        run: |
          MAJOR=$(node -p "require('./typescript/package.json').version.split('.')[0]")
          TAG=$(jq -r ".versions[\"$MAJOR\"]" version_map.json)
          if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
            echo "No entry for major version $MAJOR in version_map.json" >&2
            exit 1
          fi
          LATEST_MAJOR=$(jq -r '.latest' version_map.json)
          if [ "$MAJOR" = "$LATEST_MAJOR" ]; then
            TAG="$TAG latest"
          fi
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/publish-to-npmjs
        id: publish
        with:
          registry_token: ${{ secrets.NPMJS_TOKEN }}
          working-directory: ./typescript
          tag: ${{ steps.resolve-tag.outputs.npm_tag }}

  publish-python:
    name: "[🎯 API-CLIENT] Publish to PyPI"
    # Only run for Python releases (python-v* tag).
    if: |
      github.head_ref != 'release-please--branches--master'
      && !contains(github.event.pull_request.labels.*.name, 'autorelease')
      && (
        (github.event_name == 'release' && contains(github.event.release.tag_name, 'python-v'))
        || (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.release_tag, 'python-v'))
        || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.outputs.new_version)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.sha }}

      - uses: ./.github/actions/publish-to-pypi
        id: publish
        with:
          registry_token: ${{ secrets.PYPI_TOKEN }}
          working-directory: ./python
