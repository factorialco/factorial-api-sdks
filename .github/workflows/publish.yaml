name: "Publish packages"

run-name: "Publish ${{ inputs.release_tag }}"

# Top-level publisher. It does NOT decide WHEN to release — it only builds and
# publishes the package identified by `release_tag` from that exact tag.
#
# It runs ONLY via workflow_dispatch, never workflow_call: npm trusted
# publishing (OIDC) validates the TOP-LEVEL workflow filename and allows a
# single trusted workflow per package, so every path that publishes to npm must
# be a dispatch of THIS file (via .github/actions/dispatch-publish):
#
#   - Dispatched automatically by "Create release" (release-please.yaml) right
#     after a release is created.
#   - Dispatched by "Publish beta SDKs" (beta-publish.yaml) after it pushes a
#     beta/typescript-v* tag, with an explicit npm_dist_tag override.
#   - Can be run manually via the Actions UI to re-publish / recover a specific
#     tag (e.g. if a publish step failed).
#
# Each underlying composite action skips the upload if that version is already
# present on the registry, so re-running against an existing tag is a no-op.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build & publish (e.g. typescript-v1.2.0 or ruby/v2.0.0)"
        required: true
        type: string
      npm_dist_tag:
        description: "Space-separated npm dist-tag(s) override (e.g. 'beta 2026-10-01'). Blank = resolve from version_map.json."
        required: false
        type: string
        default: ""

jobs:
  publish-typescript:
    name: "[🎯 API-CLIENT] Publish to npm"
    # Only run for TypeScript releases (typescript-v* tag, incl. beta/ prefix).
    if: contains(inputs.release_tag, 'typescript-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Resolve npm dist-tag
        id: resolve-tag
        env:
          OVERRIDE: ${{ inputs.npm_dist_tag }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "Using npm dist-tag override: $OVERRIDE"
            echo "npm_tag=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAJOR=$(node -p "require('./typescript/package.json').version.split('.')[0]")
          TAG=$(jq -r ".versions[\"$MAJOR\"]" version_map.json)
          if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
            echo "No entry for major version $MAJOR in version_map.json" >&2
            exit 1
          fi
          LATEST_MAJOR=$(jq -r '.latest' version_map.json)
          if [ "$MAJOR" = "$LATEST_MAJOR" ]; then
            TAG="$TAG latest"
          fi
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/publish-to-npmjs
        id: publish
        with:
          # Publish authenticates via OIDC; the token is only used to add the
          # extra dist-tags (`latest` on the current major, the API date on betas).
          registry_token: ${{ secrets.NPMJS_TOKEN }}
          working-directory: ./typescript
          tag: ${{ steps.resolve-tag.outputs.npm_tag }}

  publish-python:
    name: "[🎯 API-CLIENT] Publish to PyPI"
    # Only run for Python releases (python-v* tag).
    if: contains(inputs.release_tag, 'python-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - uses: ./.github/actions/publish-to-pypi
        id: publish
        with:
          registry_token: ${{ secrets.PYPI_TOKEN }}
          working-directory: ./python

  publish-ruby:
    name: "[🎯 API-CLIENT] Publish to RubyGems"
    # Only run for Ruby releases. NOTE: release-please's ruby release type
    # hard-codes '/' as its tag separator, so Ruby tags are ruby/vX.Y.Z.
    if: contains(inputs.release_tag, 'ruby/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - uses: ./.github/actions/publish-to-rubygems
        id: publish
        with:
          registry_token: ${{ secrets.RUBYGEMS_API_KEY }}
          working-directory: ./ruby
