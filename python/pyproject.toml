[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorial-api-client"
version = "1.3.3"
description = "Official Python SDK for the Factorial API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["factorial", "hr", "api", "sdk", "openapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "attrs>=23.1.0",
  "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/factorialco/factorial-api-sdks"
Documentation = "https://apidoc.factorialhr.com"

[dependency-groups]
dev = [
  "openapi-python-client>=0.28.4",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["factorial_api_client"]

[tool.hatch.build.targets.sdist]
include = ["factorial_api_client/"]

[tool.ruff]
line-length = 100
# Generated code is not hand-maintained and is exempt from linting, mirroring the
# mypy exclude below. client.py is stage-2 output built by string-patching.
extend-exclude = ["factorial_api_client/generated/", "factorial_api_client/client.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["factorial_api_client/generated/"]
